/* Whiteboard: cartões leves e grelha adaptável */
.note-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 20px}
.note-search{width:min(100%,390px);min-height:44px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--navy);padding:10px 14px}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:16px;align-items:stretch}
.note-card{background:var(--note);border:1px solid #0b1f3a14;border-radius:16px;box-shadow:var(--shadow);padding:18px;min-height:200px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.note-card h2{font-size:1rem;margin:0}.note-card .note-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:.9rem;max-height:240px;overflow:hidden;margin:0;flex:1}.note-card .note-placeholder{color:#65768f;font-style:italic}.note-meta{color:#52647d;font-size:.74rem;line-height:1.5;margin-top:auto}.note-actions{display:flex;align-items:center;justify-content:flex-end;gap:3px;border-top:1px solid #0b1f3a19;padding-top:8px}.note-actions .icon-btn{width:35px;height:35px;color:var(--navy)}.note-actions .icon-btn:hover,.note-actions .icon-btn.pinned{color:var(--blue);background:#ffffffaa}.note-pin-label{margin-right:auto;color:#17438e;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:4px}.note-pin-label svg{width:16px;height:16px}
.note-editor{border-radius:12px;padding:16px 16px 1px;background:var(--note);margin-bottom:14px}.note-editor .field input,.note-editor .field textarea{background:#ffffffdd}.note-editor .field textarea{min-height:170px}.note-choice{background:var(--note);border:2px solid #fff;box-shadow:0 0 0 1px #aab9d0;border-radius:50%;width:38px;height:38px}.note-choice.selected{box-shadow:0 0 0 3px var(--blue)}
@media(max-width:767px){.mobile-tabs{grid-template-columns:repeat(4,minmax(0,1fr));padding-left:4px;padding-right:4px}.mobile-tabs button{min-width:0;gap:3px;font-size:.62rem;padding:4px 1px;white-space:nowrap}.mobile-tabs svg{width:19px;height:19px}.note-toolbar .note-search{flex:1 1 100%;width:100%}}
@media(max-width:370px){.mobile-tabs button{font-size:.58rem;letter-spacing:-.02em}}

/* Checklists v3: compact groups and large invisible checkbox hit targets. */
.check-cards{display:block;background:#fff;border:1px solid var(--border);border-radius:13px;padding:0 15px}
.check-card{padding:12px 0;border-bottom:1px solid #eaf0f7}
.check-card:last-child{border-bottom:0}
.check-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.check-title{border:0;background:none;color:var(--navy);font-size:.85rem;font-weight:650;text-align:left;padding:5px 0;line-height:1.35;min-width:0}
.check-title:hover,.check-more:hover{color:var(--blue);text-decoration:underline}
.check-meta,.check-count{color:var(--muted);font-size:.72rem;font-weight:500}
.check-meta{margin:0 0 3px}
.check-count{white-space:nowrap}
.check-more{display:inline-flex;align-items:center;min-height:40px;border:0;background:none;color:var(--blue);font-size:.76rem;font-weight:600;padding:4px 0}
.check-progress{height:3px;background:#ecf1f8;border-radius:10px;overflow:hidden;margin:5px 0 7px}
.check-progress span{display:block;height:100%;background:var(--blue);border-radius:10px;transition:width .2s}
.detail-checks .check-progress{margin:2px 0 8px}
.detail-checks .check-count{margin:0 0 5px}
.task-item{display:flex;gap:3px;align-items:center;min-height:40px;padding:0;border:0;font-size:.83rem;line-height:1.35;cursor:pointer;color:var(--navy);overflow-wrap:anywhere}
.task-item+.task-item{border-top:1px solid #f1f4f9}
.task-item span{min-width:0;padding:6px 0}
.task-item.done span{text-decoration:line-through;color:#8996a8}
.task-item input[type=checkbox],.task-input-row .task-done{appearance:none;-webkit-appearance:none;position:relative;width:40px;height:40px;min-width:40px;flex:none;margin:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.task-item input[type=checkbox]::before,.task-input-row .task-done::before{content:'';display:block;width:17px;height:17px;border:1.5px solid #a8b8cc;border-radius:6px;background:#fff;box-sizing:border-box}
.task-item input[type=checkbox]:checked::before,.task-input-row .task-done:checked::before{background:#2563EB;border-color:#2563EB}
.task-item input[type=checkbox]:checked::after,.task-input-row .task-done:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:800;line-height:1}
.task-item:focus-within,.task-input-row:focus-within{border-radius:7px}
.form-checks{border:0;border-top:1px solid var(--border);border-radius:0;padding:10px 0 0;margin-top:7px;min-width:0}
.form-checks legend{padding:0 7px 0 0}
.form-checks .check-count{display:block;margin:1px 0 7px}
.task-input-row{display:flex;align-items:center;gap:3px;margin:0;min-height:42px;border-bottom:1px solid #eef2f8}
.task-input-row input[type=text]{border:0;border-radius:0;background:transparent;padding:7px 2px;min-height:40px;font-size:.83rem}
.task-input-row:has(.task-done:checked) .task-text{text-decoration:line-through;color:#8996a8}
.task-input-row .icon-btn{width:40px;height:40px}

/* Separação legível entre datas, estados e tarefas. */
.count-card .count-date{display:block;line-height:1.4;overflow-wrap:anywhere}
.count-card .pill{display:block;width:max-content;max-width:100%;margin-top:9px;line-height:1.4;overflow-wrap:anywhere}
.event-info .label-cat{display:flex;flex-wrap:wrap;overflow-wrap:anywhere;line-height:1.4}
.detail-row span{min-width:0;overflow-wrap:anywhere}
.check-cards{display:block;max-width:780px}
.check-card{display:block;background:#fff;border:1px solid var(--border);border-radius:13px;padding:12px 15px;margin-bottom:12px;box-shadow:var(--shadow);transform:none}
.check-card:hover{transform:none}
.check-card-head{min-width:0;align-items:flex-start}
.check-title{min-width:0;overflow-wrap:anywhere}
.check-meta{line-height:1.5;overflow-wrap:anywhere}
.check-count{flex:none;padding-top:6px}
.task-item span{overflow-wrap:anywhere}
@media(max-width:767px){.mobile-tabs{grid-template-columns:repeat(5,minmax(0,1fr))}.mobile-tabs button{font-size:.61rem;min-width:0;gap:3px}.mobile-tabs button svg{width:19px;height:19px}.check-cards{max-width:none}}
@media(max-width:370px){.mobile-tabs button{font-size:.55rem;letter-spacing:-.035em}}
/* v5: persistent save action and direct checklist additions. */
#event-form .form-actions{position:sticky;bottom:0;z-index:3;background:#fff;margin:18px -22px -25px;padding:13px 22px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--border);box-shadow:0 -7px 18px #0b1f3a0d}
#event-form .save-event{background:var(--blue);color:#fff;min-width:145px;box-shadow:0 6px 15px #2563eb38}
.add-task-form{display:flex;align-items:stretch;gap:8px;margin-top:14px;min-width:0}
.add-task-form input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--navy);background:#fff;min-height:44px}
.add-task-form .btn{flex:none}
.add-task-form .btn svg{width:17px;height:17px}
@media(max-width:420px){.add-task-form .btn{padding:7px 9px}.add-task-form .btn span{display:none}#event-form .form-actions{margin-bottom:-25px}}
/* v6: ecrã de abertura, apenas nesta sessão de página. */
.intro-launch{display:flex;flex-direction:column;align-items:center;width:100%;min-height:100vh;min-height:100dvh;border:0;background:linear-gradient(180deg,#EAF2FF 0%,#F7FAFF 62%,#EAF2FF 100%);color:#0B1F3A;text-align:center;padding:clamp(78px,11vh,126px) 22px max(42px,env(safe-area-inset-bottom));cursor:pointer;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.intro-launch:focus-visible{outline:3px solid #2563EB;outline-offset:-5px}
.intro-kicker{color:#2563EB;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.intro-title{display:block;font-size:clamp(3.5rem,10vw,5.8rem);font-weight:800;letter-spacing:-.065em;line-height:1}
.intro-date{display:block;margin-top:16px;font-size:clamp(1.04rem,3vw,1.3rem);font-weight:600;line-height:1.4}
.intro-events{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:stretch;gap:11px;width:min(100%,450px);padding:38px 0}
.intro-event,.intro-empty{display:block;background:#fff;border:1px solid #dce7f5;border-radius:16px;box-shadow:0 9px 30px rgba(11,31,58,.07);padding:15px 20px;color:#0B1F3A;overflow-wrap:anywhere}
.intro-event-title{display:block;font-size:1rem;font-weight:700;line-height:1.4}
.intro-event-time{display:block;margin-top:4px;color:#2563EB;font-size:.9rem;font-weight:650}
.intro-empty{color:#61728b}
.intro-continue{display:block;background:#2563EB;color:white;border-radius:12px;padding:13px 20px;min-width:180px;font-weight:700;box-shadow:0 7px 18px #2563eb33}
.intro-launch:hover .intro-continue{background:#1d4ed8}
@media(max-width:767px){.intro-launch{padding-top:max(96px,env(safe-area-inset-top) + 78px);padding-bottom:max(34px,env(safe-area-inset-bottom) + 25px)}.intro-events{max-width:350px}}
</style>

<body>
<div id="app"></div><div class="toast-region" id="toasts" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='calendario-pessoal-demo-v4', NOTE_KEY='calendario-whiteboard-demo-v1', BANNER_KEY='calendario-demo-banner-v1', FIRED_KEY='calendario-demo-lembretes-v1';
const palette=['#2563EB','#0EA5E9','#1E40AF','#60A5FA','#06B6D4','#F59E0B','#10B981','#3B82F6','#1D4ED8','#0284C7','#0369A1','#0F766E','#4F46E5','#7C3AED','#8B5CF6','#BE185D','#B45309','#64748B'];
const reminderNames={none:'Sem lembrete',at:'No momento',m10:'10 min antes',h1:'1 hora antes',d1:'1 dia antes',d2:'2 dias antes',w1:'1 semana antes'};
const reminderOffsets={at:0,m10:600000,h1:3600000,d1:86400000,d2:172800000,w1:604800000};
const weekdays=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3"/>',checklists:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 1.5 1.5L11 8M13 9h5m-11 6 1.5 1.5L11 14m2 1h5"/>',whiteboard:'<path d="M5 3h11l3 3v15H5zM8 11h8M8 15h8"/>',tack:'<path d="M9 3h6l-1 5 4 4v2H6v-2l4-4-1-5ZM12 14v7"/>',categories:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="M12 20h9M4 16.5V20h3.5L18.8 8.7a2 2 0 0 0-2.8-2.8L4 17.9z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',star:'<path d="m12 3 2.7 5.7 6.3.8-4.6 4.4 1.1 6.1-5.5-2.9L6.5 20l1.1-6.1L3 9.5l6.3-.8z"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/>',notes:'<path d="M5 3h11l3 3v15H5zM8 11h8M8 15h8"/>'};
function ico(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||''}</svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeColor(c){return palette.includes(c)?c:palette[0]}
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function monday(d){return addDays(d,-(d.getDay()+6)%7)}
function pretty(s,options){return new Intl.DateTimeFormat('pt-PT',options).format(typeof s==='string'?parseDay(s):s)}
function cap(s){return s.charAt(0).toLocaleUpperCase('pt-PT')+s.slice(1)}
function fullDate(s){return cap(pretty(s,{weekday:'long',day:'numeric',month:'long'}))}
function shortDate(s){return pretty(s,{day:'numeric',month:'short'})}
function uid(){return globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function getStore(k){try{return localStorage.getItem(k)}catch{return null}}
function setStore(k,v){try{localStorage.setItem(k,v)}catch{}}
function sample(){const today=new Date();const date=n=>localISO(addDays(today,n));const names=['Matemática','Português','Biologia','Trabalhos','Pessoal','Desporto'];const cats=names.map((name,i)=>({id:`cat-${i+1}`,name,color:palette[i]}));
 const make=(title,ci,offset,start,end,important=false,items=[],allDay=false,location='',notes='',reminder='none')=>({id:uid(),title,categoryId:cats[ci].id,date:date(offset),start,end,allDay,location,notes,important,reminder,checklist:items.map((x,i)=>({id:uid(),text:x,done:i===0 && (title==='Teste de Matemática'||title==='Entrega trabalho de Biologia')}))});
 return {categories:cats,events:[
 make('Aula de Biologia',2,0,'09:00','10:30',false,[],false,'Sala 12','Sistema circulatório'),
 make('Treino',5,0,'19:00','20:00',false,[],false,'Pavilhão municipal'),
 make('Aula de Matemática',0,1,'08:30','10:00',false,[],false,'Sala 5'),
 make('Sessão de estudo em grupo',0,2,'16:00','18:00',false,['Levar apontamentos','Resolver exercícios'],false,'Biblioteca'),
 make('Consulta no dentista',4,3,'11:00','11:45',false,[],false,'Clínica do bairro','','d1'),
 make('Teste de Matemática',0,6,'09:00','10:30',true,['Rever funções','Fazer exercícios pág. 45','Ficha de revisão'],false,'Sala 5','Estudar os capítulos 3 e 4.','d1'),
 make('Jantar de aniversário da Inês',4,7,'20:00','22:30',true,[],false,'Centro da cidade','','h1'),
 make('Aula de Português',1,8,'10:00','11:30',false,[],false,'Sala 8'),
 make('Entrega trabalho de Biologia',3,10,'09:00','09:30',true,['Recolher referências','Rever bibliografia','Enviar ficheiro'],false,'Plataforma da escola','Confirmar a entrega.','d2'),
 make('Jogo de futebol',5,12,'15:00','17:00',false,['Preparar equipamento'],false,'Campo da escola'),
 make('Teste de Português',1,15,'11:00','12:30',true,['Ler textos','Rever gramática'],false,'Sala 8','','w1'),
 make('Apresentação do projeto',3,19,'14:00','15:00',true,['Fazer diapositivos','Ensaiar apresentação'],false,'Auditório'),
 make('Aula de Matemática',0,23,'09:00','10:30',false,[],false,'Sala 5'),
 make('Caminhada no parque',4,25,'17:00','18:00',false,[],false,'Parque da cidade'),
 make('Dia de descanso',4,21,'','',false,[],true)
 ]};}
const notePalette=[{name:'Azul claro',value:'#EAF2FF'},{name:'Céu',value:'#E0F2FE'},{name:'Lilás',value:'#EDE9FE'},{name:'Menta',value:'#DFF7ED'},{name:'Amarelo suave',value:'#FFF4CF'}];
function noteColor(color){return notePalette.some(c=>c.value===color)?color:notePalette[0].value}
function sampleNotes(){const now=Date.now(),day=86400000;return [
 {id:uid(),title:'Ideias para o fim de semana',body:'Passeio junto ao rio\nLer um pouco\nExperimentar uma receita nova',color:notePalette[0].value,pinned:true,createdAt:new Date(now-3*day).toISOString(),updatedAt:new Date(now-day).toISOString()},
 {id:uid(),title:'Não esquecer',body:'Levar o livro para a biblioteca\nComprar pilhas',color:notePalette[3].value,pinned:false,createdAt:new Date(now-2*day).toISOString(),updatedAt:new Date(now-2*day).toISOString()},
 {id:uid(),title:'Uma ideia rápida',body:'Organizar uma tarde de jogos com amigos.',color:notePalette[2].value,pinned:false,createdAt:new Date(now-day).toISOString(),updatedAt:new Date(now-day).toISOString()}
]}
function loadNotes(){try{const x=JSON.parse(getStore(NOTE_KEY));if(Array.isArray(x))return x}catch{}const x=sampleNotes();setStore(NOTE_KEY,JSON.stringify(x));return x}
function load(){try{const x=JSON.parse(getStore(KEY));if(x&&Array.isArray(x.categories)&&Array.isArray(x.events)&&x.categories.length)return x}catch{}const x=sample();setStore(KEY,JSON.stringify(x));return x}
let data=load(),notes=loadNotes();const state={noteQuery:'',screen:'today',view:'month',cursor:new Date(),selected:localISO(new Date()),miniCursor:new Date(),modal:null,draft:null,catDraft:null,catEditId:null,banner:getStore(BANNER_KEY)!=='hidden',intro:true};
function persist(){setStore(KEY,JSON.stringify(data))}
function persistNotes(){setStore(NOTE_KEY,JSON.stringify(notes))}
function cat(id){return data.categories.find(c=>c.id===id)||{name:'Sem categoria',color:palette[0]}}
function evsOn(day){return data.events.filter(e=>e.date===day).sort(eventSort)}
function eventSort(a,b){return a.date.localeCompare(b.date)||(a.allDay?-1:b.allDay?1:0)||(a.start||'').localeCompare(b.start||'')||a.title.localeCompare(b.title,'pt-PT')}
function openingView(){const today=localISO(new Date()),events=evsOn(today);return `<button type="button" class="intro-launch" data-action="enter-app"><span class="intro-kicker">Hoje, num relance</span><span class="intro-title">HOJE</span><span class="intro-date">${fullDate(today)}</span><span class="intro-events">${events.length?events.map(e=>`<span class="intro-event"><span class="intro-event-title">${esc(e.title)}</span><span class="intro-event-time">${e.allDay?'Dia inteiro':esc(e.start||'Sem hora')}</span></span>`).join(''):'<span class="intro-empty">Sem eventos para hoje.</span>'}</span><span class="intro-continue">Abrir calendário →</span></button>`}
function catStyle(c){return `style="--cat:${safeColor(c.color)}"`}
function progress(items){const total=items.length,done=items.filter(i=>i.done).length;return {done,total,pct:total?Math.round(done/total*100):0}}
function toast(message){const host=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;host.append(el);setTimeout(()=>el.remove(),4800)}
function navButton(screen,label,icon,cls){return `<button type="button" class="${cls} ${state.screen===screen?'active':''}" data-screen="${screen}" aria-current="${state.screen===screen?'page':'false'}">${ico(icon)}<span>${label}</span></button>`}
function miniHTML(){const d=state.miniCursor,first=new Date(d.getFullYear(),d.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let out=weekdays.map(w=>`<span>${w.slice(0,1)}</span>`).join('');for(let n=0;n<offset;n++)out+='<span></span>';for(let n=1;n<=days;n++){const iso=localISO(new Date(d.getFullYear(),d.getMonth(),n));out+=`<button class="mini-day ${iso===localISO(new Date())?'today':''} ${iso===state.selected?'selected':''}" data-select-day="${iso}" aria-label="${fullDate(iso)}">${n}</button>`}return `<div class="mini"><div class="mini-head"><button class="icon-btn" data-mini-step="-1" aria-label="Mês anterior">${ico('left')}</button><strong>${cap(pretty(d,{month:'long',year:'numeric'}))}</strong><button class="icon-btn" data-mini-step="1" aria-label="Mês seguinte">${ico('right')}</button></div><div class="mini-grid">${out}</div></div>`}
function sidebar(){return `<aside class="sidebar"><div class="brand"><span class="logo">${ico('calendar')}</span>O meu calendário</div><button class="btn new" data-action="new">${ico('plus')} ${state.screen==='whiteboard'?'Nova nota':'Novo evento'}</button><nav class="nav-list" aria-label="Navegação principal">${navButton('today','Hoje','today','nav-item')}${navButton('calendar','Calendário','calendar','nav-item')}${navButton('checklists','Checklists','checklists','nav-item')}${navButton('categories','Categorias','categories','nav-item')}${navButton('whiteboard','Whiteboard','whiteboard','nav-item')}</nav><div><div class="side-heading">Vista rápida</div>${miniHTML()}</div><div><div class="side-heading">Categorias</div><div class="side-cats">${data.categories.map(c=>`<div class="side-cat" ${catStyle(c)}><span class="dot"></span><span>${esc(c.name)}</span><small>${data.events.filter(e=>e.categoryId===c.id).length}</small></div>`).join('')}</div></div><div class="side-bottom"><button class="plain-link" data-screen="categories">Definições e dados de exemplo →</button></div></aside>`}
function header(){return `<div class="mobile-header"><span class="logo">${ico('calendar')}</span>O meu calendário</div>`}
function banner(){return state.banner?`<div class="banner" role="note"><span>Modo demonstração — os dados ficam só neste browser. Na versão final entras com a tua conta Google e tudo sincroniza entre telemóvel e computador.</span><button data-action="dismiss-banner" aria-label="Fechar aviso">×</button></div>`:''}
function tabs(){return `<nav class="mobile-tabs" aria-label="Navegação principal">${navButton('today','Hoje','today','')}${navButton('calendar','Calendário','calendar','')}${navButton('checklists','Checklists','checklists','')}${navButton('categories','Categorias','categories','')}${navButton('whiteboard','Whiteboard','whiteboard','')}</nav><button class="fab" data-action="new" aria-label="${state.screen==='whiteboard'?'Nova nota':'Novo evento'}">${ico('plus')}</button>`}
function eventRow(e){const c=cat(e.categoryId);return `<button class="event-row" ${catStyle(c)} data-open-event="${esc(e.id)}"><span class="time-col">${e.allDay?'Dia inteiro':`${esc(e.start)}–${esc(e.end)}`}</span><span class="event-marker"></span><span class="event-info"><strong>${esc(e.title)}</strong><span class="label-cat"><span class="dot"></span>${esc(c.name)}${e.location?' · '+esc(e.location):''}</span></span>${ico('right')}</button>`}
function rowList(events){return events.length?`<div class="agenda-today">${events.map(eventRow).join('')}</div>`:'<div class="empty">Ainda não há eventos para este dia. Cria o primeiro com o botão +.</div>'}
function countdown(e){const c=cat(e.categoryId),diff=Math.round((parseDay(e.date)-parseDay(localISO(new Date())))/86400000);return `<button class="count-card" ${catStyle(c)} data-open-event="${esc(e.id)}"><div class="bar"></div><span class="label-cat"><span class="dot"></span>${esc(c.name)}</span><strong>${esc(e.title)}</strong><span class="count-date small muted">${cap(pretty(e.date,{day:'numeric',month:'long'}))}</span><span class="pill">${diff===0?'É hoje!':diff===1?'Amanhã':`Faltam ${diff} dias`}</span></button>`}
function todayView(){const today=localISO(new Date());const upcoming=data.events.filter(e=>e.important&&e.date>=today).sort(eventSort);return `<div class="page-header"><div><div class="eyebrow">O teu dia, organizado</div><h1>Olá! Hoje é ${fullDate(today)}</h1><p class="muted">Vê o que vem aí e avança nas tuas tarefas.</p></div><div class="top-actions"><button class="btn secondary" data-action="notifications">${ico('bell')} Ativar lembretes</button></div></div><section><div class="section-head"><h2>Contagens importantes</h2><span class="small muted">Próximos eventos</span></div>${upcoming.length?`<div class="countdowns">${upcoming.map(countdown).join('')}</div>`:'<div class="empty">Sem eventos importantes futuros. Marca um evento como importante para o veres aqui.</div>'}</section><section class="section"><div class="section-head"><h2>Agenda de hoje</h2><span class="small muted">${evsOn(today).length} ${evsOn(today).length===1?'evento':'eventos'}</span></div>${rowList(evsOn(today))}</section><section class="settings"><h2>Lembretes nesta demonstração</h2><p class="small muted">Na versão final, os lembretes chegam como notificações normais do Android através do Google Calendar, mesmo com a app fechada.</p></section>`}
function checklistsView(){const events=data.events.filter(e=>e.checklist?.length).sort(eventSort);return `<div class="page-header"><div><div class="eyebrow">Tarefas dos teus eventos</div><h1>Checklists</h1><p class="muted">Todas as tarefas, concluídas e por fazer.</p></div></div>${events.length?`<div class="check-cards">${events.map(e=>{const p=progress(e.checklist);return `<section class="check-card"><div class="check-meta">${esc(cat(e.categoryId).name)} · ${shortDate(e.date)}</div><div class="check-card-head"><button type="button" class="check-title" data-open-event="${esc(e.id)}">${esc(e.title)}</button><span class="check-count">${p.done}/${p.total}</span></div><div class="check-progress" aria-hidden="true"><span style="width:${p.pct}%"></span></div>${e.checklist.map(item=>taskRow(e,item)).join('')}${addTaskForm(e)}</section>`}).join('')}</div>`:'<div class="empty">Ainda não há checklists. Adiciona tarefas a um evento para as veres aqui.</div>'}` }
function calHeader(){let d=state.cursor,title=state.view==='month'?cap(pretty(d,{month:'long',year:'numeric'})):state.view==='week'?`${shortDate(localISO(monday(d)))} – ${shortDate(localISO(addDays(monday(d),6)))} ${addDays(monday(d),6).getFullYear()}`:state.view==='day'?fullDate(localISO(d)):'Todos os eventos';return `<div class="page-header"><div><div class="eyebrow">Planeia com clareza</div><h1>Calendário</h1><p class="muted">Escolhe a vista que te dá mais jeito.</p></div></div><div class="segmented" role="group" aria-label="Vista do calendário">${[['day','Dia'],['week','Semana'],['month','Mês'],['agenda','Agenda']].map(([v,t])=>`<button data-view="${v}" class="${state.view===v?'active':''}" aria-pressed="${state.view===v}">${t}</button>`).join('')}</div>${state.view==='agenda'?'':`<div class="cal-toolbar"><h2>${esc(title)}</h2><div class="cal-controls"><button class="icon-btn" data-cal-step="-1" aria-label="Anterior">${ico('left')}</button><button class="icon-btn" data-cal-step="1" aria-label="Seguinte">${ico('right')}</button><button class="btn ghost small-btn" data-action="cal-today">Hoje</button></div></div>`}`}
function monthView(){const d=state.cursor,first=new Date(d.getFullYear(),d.getMonth(),1),start=addDays(first,-(first.getDay()+6)%7),last=new Date(d.getFullYear(),d.getMonth()+1,0),cells=Math.ceil(((first.getDay()+6)%7+last.getDate())/7)*7;let html=`<div class="month-grid">${weekdays.map(w=>`<div class="weekday">${w}</div>`).join('')}`;for(let i=0;i<cells;i++){const date=addDays(start,i),iso=localISO(date),events=evsOn(iso),inMonth=date.getMonth()===d.getMonth();html+=`<div class="month-day ${inMonth?'':'outside'} ${iso===localISO(new Date())?'today':''} ${iso===state.selected?'selected':''}" role="button" tabindex="0" data-select-day="${iso}" aria-label="${fullDate(iso)}, ${events.length} eventos"><span class="day-number">${date.getDate()}</span><div class="day-dots">${events.slice(0,4).map(e=>`<span ${catStyle(cat(e.categoryId))}></span>`).join('')}</div>${events.slice(0,2).map(e=>`<button class="chip" ${catStyle(cat(e.categoryId))} data-open-event="${esc(e.id)}">${e.allDay?'':esc(e.start)+' '}${esc(e.title)}</button>`).join('')}${events.length>2?`<div class="more">+${events.length-2} mais</div>`:''}</div>`}html+='</div>';return html+`<div class="day-preview"><div class="section-head"><h3>${fullDate(state.selected)}</h3><button class="btn secondary small-btn" data-action="new">${ico('plus')} Novo evento</button></div>${rowList(evsOn(state.selected))}</div>`}
function timeMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function timeline(days){const single=days.length===1;let html=`<div class="timeline-scroll"><div class="timeline-inner ${single?'single':''}" style="--cols:${days.length}"><div class="timeline-days"><div></div>${days.map(d=>`<div class="${d===localISO(new Date())?'today-label':''}">${cap(pretty(d,{weekday:'short',day:'numeric',month:'short'}))}</div>`).join('')}</div><div class="timeline-body"><div class="hour-axis">${Array.from({length:17},(_,i)=>`<span class="hour-label" style="top:${i*64}px">${String(i+7).padStart(2,'0')}:00</span>`).join('')}</div>${days.map(d=>`<div class="time-day">${evsOn(d).map(e=>{const start=e.allDay?420:timeMinutes(e.start),end=e.allDay?465:timeMinutes(e.end),top=Math.max(0,(start-420)*64/60),height=Math.max(0,(Math.min(1380,end)-Math.max(420,start))*64/60);if(!height)return '';const c=cat(e.categoryId);return `<button class="time-event" style="--cat:${safeColor(c.color)};top:${top}px;height:${Math.max(22,height-2)}px" data-open-event="${esc(e.id)}" title="${esc(e.title)}"><strong>${esc(e.title)}</strong><span>${e.allDay?'Dia inteiro':`${esc(e.start)}–${esc(e.end)}`}</span></button>`}).join('')}</div>`).join('')}</div></div></div>`;return html}
function agendaView(){const grouped=new Map();for(const e of [...data.events].sort(eventSort)){if(!grouped.has(e.date))grouped.set(e.date,[]);grouped.get(e.date).push(e)}return grouped.size?[...grouped].map(([date,events])=>`<section class="agenda-group"><h3>${fullDate(date)}</h3>${rowList(events)}</section>`).join(''):'<div class="empty">Ainda não há eventos. Cria um para começar.</div>'}
function calendarView(){let body=state.view==='month'?monthView():state.view==='day'?timeline([localISO(state.cursor)]):state.view==='week'?timeline(Array.from({length:7},(_,i)=>localISO(addDays(monday(state.cursor),i)))):agendaView();return calHeader()+body}
function categoriesView(){return `<div class="page-header"><div><div class="eyebrow">Tudo no seu lugar</div><h1>Categorias</h1><p class="muted">Dá uma cor a cada parte do teu dia.</p></div><button class="btn" data-action="new-category">${ico('plus')} Nova categoria</button></div><div class="category-grid">${data.categories.map(c=>{const n=data.events.filter(e=>e.categoryId===c.id).length;return `<div class="category-card" ${catStyle(c)}><span class="category-swatch"></span><span class="meta"><strong>${esc(c.name)}</strong><small>${n} ${n===1?'evento':'eventos'}</small></span><span class="category-actions"><button class="icon-btn" data-edit-category="${esc(c.id)}" aria-label="Editar ${esc(c.name)}">${ico('edit')}</button><button class="icon-btn" data-delete-category="${esc(c.id)}" aria-label="Apagar ${esc(c.name)}">${ico('trash')}</button></span></div>`}).join('')}</div><div class="settings"><h2>Definições da demonstração</h2><p class="small muted">Os dados são guardados apenas neste browser. Na versão final, a tua conta Google sincroniza o calendário entre dispositivos.</p><div class="top-actions"><button class="btn secondary" data-action="notifications">${ico('bell')} Ativar lembretes</button><button class="btn ghost" data-action="reset">Repor dados de exemplo</button></div><p class="small muted" style="margin:12px 0 0">Na versão final, os lembretes chegam como notificações normais do Android através do Google Calendar, mesmo com a app fechada.</p></div>`}
function noteDate(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'Data indisponível':new Intl.DateTimeFormat('pt-PT',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function filteredNotes(){const query=state.noteQuery.trim().toLocaleLowerCase('pt-PT');return [...notes].filter(n=>!query||`${n.title||''} ${n.body||''}`.toLocaleLowerCase('pt-PT').includes(query)).sort((a,b)=>Number(Boolean(b.pinned))-Number(Boolean(a.pinned))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}
function noteCards(){const visible=filteredNotes();return visible.length?visible.map(n=>`<article class="note-card" style="--note:${noteColor(n.color)}"><h2>${esc(n.title||'Nota sem título')}</h2><p class="note-body ${n.body?'':'note-placeholder'}">${n.body?esc(n.body):'Escreve algo nesta nota.'}</p><div class="note-meta">Criada: ${noteDate(n.createdAt)}<br>Alterada: ${noteDate(n.updatedAt)}</div><div class="note-actions"><span class="note-pin-label">${n.pinned?ico('tack')+' Fixada':''}</span><button type="button" class="icon-btn ${n.pinned?'pinned':''}" data-pin-note="${esc(n.id)}" aria-label="${n.pinned?'Desafixar':'Fixar'} nota" aria-pressed="${!!n.pinned}" title="${n.pinned?'Desafixar':'Fixar'}">${ico('tack')}</button><button type="button" class="icon-btn" data-edit-note="${esc(n.id)}" aria-label="Editar nota" title="Editar">${ico('edit')}</button><button type="button" class="icon-btn" data-delete-note="${esc(n.id)}" aria-label="Apagar nota" title="Apagar">${ico('trash')}</button></div></article>`).join(''):'<div class="empty">'+(state.noteQuery.trim()?'Nenhuma nota corresponde à pesquisa.':'Ainda não há notas. Cria a primeira com «Nova nota».')+'</div>'}
function whiteboardView(){return `<div class="page-header"><div><div class="eyebrow">Ideias à mão</div><h1>Whiteboard</h1><p class="muted">Notas rápidas, separadas dos eventos do calendário.</p></div><button class="btn" data-action="new-note">${ico('plus')} Nova nota</button></div><div class="note-toolbar"><input type="search" id="note-search" class="note-search" value="${esc(state.noteQuery)}" placeholder="Pesquisar notas" aria-label="Pesquisar notas"><span id="note-count" class="small muted">${filteredNotes().length} ${filteredNotes().length===1?'nota':'notas'}</span></div><div id="note-grid" class="note-grid">${noteCards()}</div>`}
function noteForm(){const n=notes.find(x=>x.id===state.modal.id);if(!n)return '';return modalFrame('Editar nota',`<form id="note-form"><div class="note-editor" style="--note:${noteColor(n.color)}"><div class="field"><label for="note-title">Título <span class="muted">(opcional)</span></label><input id="note-title" name="title" maxlength="120" value="${esc(n.title)}" placeholder="Título da nota"></div><div class="field"><label for="note-body">Texto <span class="muted">(opcional)</span></label><textarea id="note-body" name="body" maxlength="5000" placeholder="Escreve a tua nota...">${esc(n.body)}</textarea></div></div><div class="field"><span class="field-label">Cor</span><div class="color-choices" role="group" aria-label="Cor da nota">${notePalette.map(c=>`<button type="button" class="note-choice ${noteColor(n.color)===c.value?'selected':''}" data-note-color="${c.value}" style="--note:${c.value}" aria-label="${c.name}" aria-pressed="${noteColor(n.color)===c.value}"></button>`).join('')}</div></div><p class="small muted" id="note-save-status" role="status">Guardado automaticamente neste browser.</p><div class="form-actions"><button type="button" class="btn secondary" data-pin-note="${esc(n.id)}">${n.pinned?'Desafixar':'Fixar'} nota</button><button type="button" class="btn danger" data-delete-note="${esc(n.id)}">${ico('trash')} Apagar</button><button type="submit" class="btn">Fechar</button></div></form>`)}
function modalFrame(title,body){return `<div class="overlay" data-action="close-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close" aria-label="Fechar">${ico('close')}</button></div><div class="dialog-body">${body}</div></section></div>`}
function taskRow(e,item){return `<label class="task-item ${item.done?'done':''}"><input type="checkbox" data-toggle-task="${esc(e.id)}" data-task-id="${esc(item.id)}" aria-label="${item.done?'Desmarcar':'Concluir'}: ${esc(item.text)}" ${item.done?'checked':''}><span>${esc(item.text)}</span></label>`}
function addTaskForm(e){return `<form class="add-task-form" data-event-id="${esc(e.id)}"><input type="text" name="task" required maxlength="200" placeholder="Nova tarefa" aria-label="Nova tarefa para ${esc(e.title)}"><button type="submit" class="btn small-btn" aria-label="Adicionar tarefa a ${esc(e.title)}">${ico('plus')}<span>Adicionar</span></button></form>`}
function detailModal(e){const c=cat(e.categoryId),p=progress(e.checklist||[]);return modalFrame('Detalhes do evento',`<div class="detail-top" ${catStyle(c)}><span class="category-swatch"></span><div><h3>${esc(e.title)}</h3><span class="muted small">${esc(c.name)}${e.important?' · Importante':''}</span></div></div><div class="detail-row">${ico('calendar')}<span>${fullDate(e.date)}</span></div><div class="detail-row">${ico('clock')}<span>${e.allDay?'Dia inteiro':`${esc(e.start)}–${esc(e.end)}`}</span></div>${e.location?`<div class="detail-row">${ico('pin')}<span>${esc(e.location)}</span></div>`:''}<div class="detail-row">${ico('bell')}<span>${reminderNames[e.reminder]||reminderNames.none}</span></div>${e.notes?`<div class="detail-row">${ico('notes')}<span class="notes">${esc(e.notes)}</span></div>`:''}${(e.checklist||[]).length?`<div class="detail-checks"><h3>Checklist</h3><div class="check-count">${p.done}/${p.total} concluídos</div><div class="check-progress" aria-hidden="true"><span style="width:${p.pct}%"></span></div>${e.checklist.map(item=>taskRow(e,item)).join('')}${addTaskForm(e)}</div>`:''}<div class="form-actions"><button class="btn danger" data-delete-event="${esc(e.id)}">${ico('trash')} Apagar</button><button class="btn" data-edit-event="${esc(e.id)}">${ico('edit')} Editar</button></div>`)}
function itemInputs(items){return items.map(item=>`<div class="task-input-row"><input type="checkbox" class="task-done" aria-label="Concluído" ${item.done?'checked':''}><input type="text" class="task-text" value="${esc(item.text)}" placeholder="Nova tarefa" aria-label="Texto da tarefa" maxlength="200"><button type="button" class="icon-btn" data-action="remove-item" aria-label="Remover tarefa">${ico('close')}</button></div>`).join('')}
function eventForm(){const e=state.draft;return modalFrame(state.modal.mode==='edit'?'Editar evento':'Novo evento',`<form id="event-form"><div class="field"><label for="event-title">Título *</label><input id="event-title" name="title" required maxlength="120" value="${esc(e.title)}" placeholder="Ex.: Aula, consulta, jantar…"></div><div class="field"><label for="event-category">Categoria *</label><select id="event-category" name="categoryId" required>${data.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===e.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label for="event-date">Data *</label><input id="event-date" type="date" name="date" required value="${esc(e.date)}"></div><div class="field"><span class="field-label">Duração</span><label class="tick-field"><input type="checkbox" name="allDay" id="event-all-day" ${e.allDay?'checked':''}> Dia inteiro</label></div></div><div class="form-grid" id="time-fields" ${e.allDay?'hidden':''}><div class="field"><label for="event-start">Início *</label><input type="time" id="event-start" name="start" value="${esc(e.start||'09:00')}" ${e.allDay?'':'required'}></div><div class="field"><label for="event-end">Fim *</label><input type="time" id="event-end" name="end" value="${esc(e.end||'10:00')}" ${e.allDay?'':'required'}></div></div><div class="field"><label for="event-location">Local <span class="muted">(opcional)</span></label><input id="event-location" name="location" maxlength="160" value="${esc(e.location)}" placeholder="Onde vai acontecer?"></div><div class="field"><label for="event-notes">Notas <span class="muted">(opcional)</span></label><textarea id="event-notes" name="notes" maxlength="2000" placeholder="Informações úteis…">${esc(e.notes)}</textarea></div><label class="tick-field"><input type="checkbox" name="important" ${e.important?'checked':''}> Importante (mostrar contagem)</label><div class="field"><label for="event-reminder">Lembrete</label><select id="event-reminder" name="reminder">${Object.entries(reminderNames).map(([v,t])=>`<option value="${v}" ${e.reminder===v?'selected':''}>${t}</option>`).join('')}</select></div><fieldset class="form-checks"><legend>Checklist</legend><span class="check-count" id="form-check-count">${progress(e.checklist||[]).done}/${(e.checklist||[]).length} concluídos</span><div id="form-items">${itemInputs(e.checklist||[])}</div><button type="button" class="btn secondary small-btn" data-action="add-item">${ico('plus')} Adicionar tarefa</button></fieldset><div class="form-actions"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn save-event">${ico('calendar')} Guardar</button></div></form>`)}
function categoryForm(){const c=state.catDraft;return modalFrame(state.catEditId?'Editar categoria':'Nova categoria',`<form id="category-form"><div class="field"><label for="cat-name">Nome da categoria *</label><input id="cat-name" name="name" maxlength="55" required value="${esc(c.name)}" placeholder="Ex.: Música"></div><div class="field"><span class="field-label">Cor</span><div class="color-choices" role="group" aria-label="Escolher cor">${palette.map((col,i)=>`<button type="button" data-color="${col}" class="color-choice ${col===c.color?'selected':''}" style="--cat:${col}" aria-label="Cor ${i+1}" aria-pressed="${col===c.color}"></button>`).join('')}</div></div><div class="form-actions"><button class="btn ghost" type="button" data-action="close">Cancelar</button><button class="btn" type="submit">Guardar categoria</button></div></form>`)}
function render(){if(state.intro){document.getElementById('app').innerHTML=openingView();document.body.style.overflow='';return}document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<div class="content-wrap">${banner()}${header()}<main class="main" id="main">${state.screen==='today'?todayView():state.screen==='calendar'?calendarView():state.screen==='checklists'?checklistsView():state.screen==='whiteboard'?whiteboardView():categoriesView()}</main></div></div>${tabs()}${state.modal?(state.modal.type==='detail'?detailModal(data.events.find(e=>e.id===state.modal.id)||{title:'Evento removido',date:localISO(new Date()),checklist:[],reminder:'none',allDay:true}):state.modal.type==='event'?eventForm():state.modal.type==='note'?noteForm():categoryForm()):''}`;document.body.style.overflow=state.modal?'hidden':''}
function closeModal(){state.modal=null;state.draft=null;render()}
function newNote(){const time=new Date().toISOString(),n={id:uid(),title:'',body:'',color:notePalette[0].value,pinned:false,createdAt:time,updatedAt:time};notes.unshift(n);persistNotes();openNote(n.id)}
function openNote(id){if(!notes.some(n=>n.id===id))return;state.modal={type:'note',id};render();document.getElementById('note-title')?.focus()}
function updateNote(id,changes){const n=notes.find(x=>x.id===id);if(!n)return;Object.assign(n,changes,{updatedAt:new Date().toISOString()});persistNotes()}
function openNew(){state.draft={title:'',categoryId:data.categories[0].id,date:state.screen==='calendar'?state.selected:localISO(new Date()),start:'09:00',end:'10:00',allDay:false,location:'',notes:'',important:false,checklist:[],reminder:'none'};state.modal={type:'event',mode:'new'};render();document.getElementById('event-title')?.focus()}
function openEdit(id){const e=data.events.find(x=>x.id===id);if(!e)return;state.draft=structuredClone(e);state.modal={type:'event',mode:'edit',id};render();document.getElementById('event-title')?.focus()}
function openCategory(id){const c=data.categories.find(x=>x.id===id);state.catEditId=c?.id||null;state.catDraft=c?{...c}:{name:'',color:palette[0]};state.modal={type:'category'};render();document.getElementById('cat-name')?.focus()}
function changeDay(iso){state.selected=iso;state.cursor=parseDay(iso);state.miniCursor=parseDay(iso);state.screen='calendar';render()}
function stepCalendar(n){const d=state.cursor;if(state.view==='month')state.cursor=new Date(d.getFullYear(),d.getMonth()+n,1);else state.cursor=addDays(d,n*(state.view==='week'?7:1));if(state.view==='day')state.selected=localISO(state.cursor);render()}
function activateReminders(){if(!('Notification' in window)||!window.isSecureContext){toast('As notificações não estão disponíveis aqui. Os lembretes aparecem na página enquanto estiver aberta.');return}Notification.requestPermission().then(p=>toast(p==='granted'?'Lembretes ativados enquanto esta página estiver aberta.':'Sem autorização para notificações. Os lembretes aparecem na página.')).catch(()=>toast('Não foi possível ativar notificações. Os lembretes aparecem na página.'))}
function reminderTick(){const now=Date.now();let sent;try{sent=JSON.parse(getStore(FIRED_KEY)||'{}')}catch{sent={}}let changed=false;for(const e of data.events){if(!(e.reminder in reminderOffsets))continue;const base=new Date(`${e.date}T${e.allDay?'09:00':e.start||'09:00'}:00`).getTime();if(!Number.isFinite(base))continue;const when=base-reminderOffsets[e.reminder],key=e.id+'|'+e.reminder+'|'+when;if(now>=when&&now<when+60000&&!sent[key]){sent[key]=now;changed=true;const msg=`${e.title} — ${fullDate(e.date)}${e.allDay?'':`, ${e.start}`}`;if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Lembrete · O meu calendário',{body:msg,icon:iconData})}catch{toast('Lembrete: '+msg)}}else toast('Lembrete: '+msg)}}if(changed){for(const [k,t] of Object.entries(sent))if(now-t>30*86400000)delete sent[k];setStore(FIRED_KEY,JSON.stringify(sent))}}
const iconSVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#2563EB"/><rect x="11" y="17" width="42" height="37" rx="6" fill="white"/><path d="M11 28h42M21 12v11M43 12v11" stroke="#2563EB" stroke-width="5"/><circle cx="32" cy="40" r="6" fill="#2563EB"/></svg>';
const iconData='data:image/svg+xml,'+encodeURIComponent(iconSVG);document.getElementById('app-manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'O meu calendário',short_name:'Calendário',start_url:'.',display:'standalone',background_color:'#F7FAFF',theme_color:'#2563EB',icons:[{src:iconData,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]}));
document.addEventListener('click',event=>{const t=event.target.closest('button,[data-select-day],[data-action]');if(!t)return;if(t.classList.contains('overlay')&&event.target!==t)return;if(t.closest('.overlay')&&t.hasAttribute('data-action')&&t.dataset.action==='close-overlay'&&event.target!==t)return;
 if(t.dataset.screen){state.screen=t.dataset.screen;state.modal=null;render();window.scrollTo(0,0);return}
 if(t.dataset.view){state.view=t.dataset.view;render();return}
 if(t.dataset.miniStep){state.miniCursor=new Date(state.miniCursor.getFullYear(),state.miniCursor.getMonth()+Number(t.dataset.miniStep),1);render();return}
 if(t.dataset.calStep){stepCalendar(Number(t.dataset.calStep));return}
 if(t.dataset.selectDay){changeDay(t.dataset.selectDay);return}
 if(t.dataset.openEvent){state.modal={type:'detail',id:t.dataset.openEvent};render();return}
 if(t.dataset.editEvent){openEdit(t.dataset.editEvent);return}
 if(t.dataset.deleteEvent){const e=data.events.find(x=>x.id===t.dataset.deleteEvent);if(e&&confirm(`Apagar «${e.title}»?`)){data.events=data.events.filter(x=>x.id!==e.id);persist();closeModal();toast('Evento apagado.')}return}
 if(t.dataset.editNote){openNote(t.dataset.editNote);return}
 if(t.dataset.pinNote){const n=notes.find(x=>x.id===t.dataset.pinNote);if(n){updateNote(n.id,{pinned:!n.pinned});render();toast(n.pinned?'Nota fixada.':'Nota desafixada.')}return}
 if(t.dataset.deleteNote){const n=notes.find(x=>x.id===t.dataset.deleteNote);if(n&&confirm(`Apagar ${n.title?'«'+n.title+'»':'esta nota'}?`)){notes=notes.filter(x=>x.id!==n.id);persistNotes();if(state.modal?.type==='note')state.modal=null;render();toast('Nota apagada.')}return}
 if(t.dataset.noteColor){const n=notes.find(x=>x.id===state.modal?.id);if(n){updateNote(n.id,{color:noteColor(t.dataset.noteColor)});document.querySelector('.note-editor')?.style.setProperty('--note',n.color);document.querySelectorAll('.note-choice').forEach(x=>{const selected=x.dataset.noteColor===n.color;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',selected)})}return}
 if(t.dataset.editCategory){openCategory(t.dataset.editCategory);return}
 if(t.dataset.deleteCategory){const c=data.categories.find(x=>x.id===t.dataset.deleteCategory);if(!c)return;if(data.categories.length===1){toast('É necessário manter pelo menos uma categoria.');return}const n=data.events.filter(e=>e.categoryId===c.id).length;if(confirm(`Apagar a categoria «${c.name}»? ${n?n+' evento(s) serão atribuídos à primeira categoria disponível.':'Não há eventos nesta categoria.'}`)){data.categories=data.categories.filter(x=>x.id!==c.id);for(const e of data.events)if(e.categoryId===c.id)e.categoryId=data.categories[0].id;persist();render();toast('Categoria apagada.')}return}
 if(t.dataset.color){state.catDraft.color=t.dataset.color;document.querySelectorAll('.color-choice').forEach(x=>{const selected=x.dataset.color===state.catDraft.color;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',selected)});return}
 switch(t.dataset.action){case 'enter-app':state.intro=false;render();break;case 'new':if(state.screen==='whiteboard')newNote();else openNew();break;case 'new-note':newNote();break;case 'new-category':openCategory();break;case 'close':case 'close-overlay':closeModal();break;case 'dismiss-banner':state.banner=false;setStore(BANNER_KEY,'hidden');render();break;case 'cal-today':state.cursor=new Date();state.selected=localISO(state.cursor);render();break;case 'notifications':activateReminders();break;case 'reset':if(confirm('Repor os dados de exemplo? Os eventos, categorias e notas atuais serão substituídos.')){data=sample();notes=sampleNotes();persist();persistNotes();state.noteQuery='';setStore(FIRED_KEY,'{}');state.cursor=new Date();state.selected=localISO(state.cursor);state.miniCursor=new Date();render();toast('Dados de exemplo repostos.')}break;case 'add-item':document.getElementById('form-items').insertAdjacentHTML('beforeend',itemInputs([{text:'',done:false}]));document.querySelector('#form-items .task-input-row:last-child .task-text')?.focus();updateFormCheckCount();break;case 'remove-item':t.closest('.task-input-row')?.remove();updateFormCheckCount();break;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('month-day')){e.preventDefault();changeDay(e.target.dataset.selectDay)}});
document.addEventListener('input',e=>{if(e.target.id==='note-search'){state.noteQuery=e.target.value;const grid=document.getElementById('note-grid'),count=document.getElementById('note-count');if(grid)grid.innerHTML=noteCards();if(count){const n=filteredNotes().length;count.textContent=`${n} ${n===1?'nota':'notas'}`}return}if(state.modal?.type==='note'&&(e.target.id==='note-title'||e.target.id==='note-body')){updateNote(state.modal.id,{[e.target.id==='note-title'?'title':'body']:e.target.value})}});
function updateFormCheckCount(){const rows=[...document.querySelectorAll('#form-items .task-input-row')],count=document.getElementById('form-check-count');if(count)count.textContent=`${rows.filter(row=>row.querySelector('.task-done').checked).length}/${rows.length} concluídos`}
document.addEventListener('change',e=>{if(e.target.matches('.task-done'))updateFormCheckCount();if(e.target.id==='event-all-day'){const wrap=document.getElementById('time-fields');wrap.hidden=e.target.checked;wrap.querySelectorAll('input').forEach(x=>x.required=!e.target.checked)}if(e.target.matches('[data-toggle-task]')){const ev=data.events.find(x=>x.id===e.target.dataset.toggleTask),item=ev?.checklist.find(x=>x.id===e.target.dataset.taskId);if(item){item.done=e.target.checked;persist();const dialog=document.querySelector('.dialog'),scroll=dialog?.scrollTop;render();if(dialog&&document.querySelector('.dialog'))document.querySelector('.dialog').scrollTop=scroll}}});
document.addEventListener('submit',e=>{if(e.target.matches('.add-task-form')){e.preventDefault();const f=e.target,ev=data.events.find(x=>x.id===f.dataset.eventId),text=f.elements.task.value.trim();if(!ev||!text)return;ev.checklist=ev.checklist||[];ev.checklist.push({id:uid(),text,done:false});persist();const dialog=document.querySelector('.dialog'),scroll=dialog?.scrollTop;render();if(dialog&&document.querySelector('.dialog'))document.querySelector('.dialog').scrollTop=scroll;toast('Tarefa adicionada.');return}if(e.target.id==='note-form'){e.preventDefault();closeModal();return}if(e.target.id==='event-form'){e.preventDefault();const f=e.target,fd=new FormData(f),allDay=fd.has('allDay'),start=fd.get('start'),end=fd.get('end');if(!allDay&&start>=end){toast('A hora de fim tem de ser posterior à hora de início.');f.elements.end.focus();return}const checklist=[...f.querySelectorAll('.task-input-row')].map(row=>({id:uid(),text:row.querySelector('.task-text').value.trim(),done:row.querySelector('.task-done').checked})).filter(x=>x.text);const updated={id:state.modal.mode==='edit'?state.modal.id:uid(),title:fd.get('title').trim(),categoryId:fd.get('categoryId'),date:fd.get('date'),start:allDay?'':start,end:allDay?'':end,allDay,location:fd.get('location').trim(),notes:fd.get('notes').trim(),important:fd.has('important'),reminder:fd.get('reminder'),checklist};if(!updated.title){toast('Escreve um título para o evento.');return}if(state.modal.mode==='edit'){const old=data.events.find(x=>x.id===updated.id);updated.checklist=checklist.map((x,i)=>({...x,id:old?.checklist?.[i]?.id||x.id}));data.events=data.events.map(x=>x.id===updated.id?updated:x)}else data.events.push(updated);persist();if(state.screen==='calendar'&&(state.view==='day'||state.view==='week')){state.cursor=parseDay(updated.date);state.selected=updated.date}closeModal();toast('Evento guardado.');return}
 if(e.target.id==='category-form'){e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name){toast('Escreve um nome para a categoria.');return}if(data.categories.some(x=>x.name.toLocaleLowerCase('pt-PT')===name.toLocaleLowerCase('pt-PT')&&x.id!==state.catEditId)){toast('Já existe uma categoria com esse nome.');return}if(state.catEditId){const c=data.categories.find(x=>x.id===state.catEditId);if(c){c.name=name;c.color=state.catDraft.color}}else data.categories.push({id:uid(),name,color:state.catDraft.color});persist();closeModal();toast('Categoria guardada.')}});
render();reminderTick();setInterval(reminderTick,30000);
})();
</script>
</body>
</html>
